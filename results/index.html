<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FC.K 試合結果ノート</title>
<meta name="theme-color" content="#0d5c36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="試合結果">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#0d5c36; --green-d:#08402a; --green-l:#e7f2ec;
  --gold:#c9a227; --gold-l:#f6edd0;
  --ink:#1b2420; --sub:#66736c; --line:#e3e8e5; --bg:#f4f6f5; --card:#fff;
  --win:#1f8f4e; --draw:#8a8f8c; --lose:#c0392b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans JP",system-ui,sans-serif;background:var(--bg);color:var(--ink);
  padding-bottom:calc(96px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
header{background:linear-gradient(160deg,var(--green) 0%,var(--green-d) 100%);color:#fff;
  padding:calc(14px + env(safe-area-inset-top)) 18px 0;position:relative;overflow:hidden}
header::after{content:"";position:absolute;right:-60px;top:-40px;width:220px;height:220px;border-radius:50%;
  border:2px solid rgba(201,162,39,.25)}
.brand{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.brand .logo{width:52px;height:auto;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.brand h1{font-size:19px;font-weight:900;letter-spacing:.04em;line-height:1.2}
.brand h1 small{display:block;font-family:Oswald,sans-serif;font-size:12px;color:var(--gold);letter-spacing:.2em;font-weight:500}
.filters{display:flex;gap:8px;margin-top:14px;position:relative;z-index:1}
.filters select{flex:1;min-width:0;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;
  border-radius:10px;padding:8px 10px;font-size:14px;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,#fff 50%),linear-gradient(135deg,#fff 50%,transparent 50%);
  background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.filters select option{color:var(--ink)}
.tabs{display:flex;margin-top:14px;position:relative;z-index:1}
.tabs button{flex:1;background:none;border:0;color:rgba(255,255,255,.7);padding:12px 0;font-weight:700;font-size:15px;
  border-bottom:3px solid transparent;cursor:pointer}
.tabs button.on{color:#fff;border-bottom-color:var(--gold)}
main{padding:14px;max-width:640px;margin:0 auto}
.cloudbtn{margin-left:auto;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:12px;width:42px;height:42px;display:grid;place-items:center;cursor:pointer;position:relative}
.cloudbtn.on{color:var(--gold);border-color:var(--gold)}
.cloudbtn.on::after{content:"";position:absolute;right:6px;top:6px;width:7px;height:7px;border-radius:50%;background:#5fd38d}
.viewer .fab,.viewer .cloudbtn{display:none!important}
.memotg{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0 10px;cursor:pointer}
.memotg input{width:20px;height:20px;accent-color:var(--green)}
.viewbadge{display:none;margin-left:auto;font-size:11px;font-weight:700;color:var(--green-d);background:var(--gold);border-radius:20px;padding:4px 10px;white-space:nowrap}
.viewer .viewbadge{display:block}
.vlink{font-size:12px;word-break:break-all;background:var(--green-l);color:var(--green);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.viewfoot{display:none;text-align:center;margin:20px 0 10px}
.viewer .viewfoot{display:block}
.viewfoot button{background:none;border:0;color:var(--sub);font-size:11px;text-decoration:underline;cursor:pointer}
.notice.tap{cursor:pointer;background:var(--green-l);color:var(--green);font-weight:700}
.notice.warn{background:#fdecea;color:var(--lose)}
.code{font-family:Oswald,monospace;font-size:26px;letter-spacing:.08em;text-align:center;background:var(--green-l);color:var(--green);border-radius:10px;padding:10px;margin:6px 0 10px}
.cp{font-size:12px;color:var(--sub);line-height:1.6;margin:4px 0 8px}
.notice{font-size:12px;color:var(--sub);background:var(--gold-l);border-radius:10px;padding:8px 12px;margin-bottom:12px;display:none}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.summary div{background:var(--card);border-radius:12px;padding:10px 4px;text-align:center;border:1px solid var(--line)}
.summary b{display:block;font-family:Oswald,sans-serif;font-size:24px;line-height:1.1}
.summary span{font-size:11px;color:var(--sub)}
.summary .w b{color:var(--win)} .summary .d b{color:var(--draw)} .summary .l b{color:var(--lose)}
.month{font-size:12px;color:var(--sub);font-weight:700;margin:16px 4px 6px;letter-spacing:.05em}
.match{background:var(--card);border-radius:14px;border:1px solid var(--line);padding:12px 14px;margin-bottom:8px;
  display:flex;align-items:center;gap:12px;cursor:pointer;transition:transform .1s}
.match:active{transform:scale(.98)}
.res{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:14px;flex:none}
.res.W{background:var(--win)} .res.D{background:var(--draw)} .res.L{background:var(--lose)}
.minfo{flex:1;min-width:0}
.minfo .opp{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.minfo .meta{font-size:12px;color:var(--sub);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{background:var(--green-l);color:var(--green);border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700}
.tag.s{background:#eef0f7;color:#38407a}
.tag.k{background:var(--gold-l);color:#8a6d10}
.score{font-family:Oswald,sans-serif;font-size:24px;font-weight:700;white-space:nowrap;text-align:right}
.score small{display:block;font-family:"Noto Sans JP";font-size:10px;color:var(--sub);font-weight:400}
.empty{text-align:center;color:var(--sub);padding:50px 20px;font-size:14px;line-height:1.8}
.empty .emb{width:80px;height:auto;opacity:.35;margin-bottom:10px}
.card{background:var(--card);border-radius:14px;border:1px solid var(--line);padding:14px;margin-bottom:12px}
.card h3{font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.card h3::before{content:"";width:4px;height:16px;background:var(--gold);border-radius:2px}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.statgrid b{display:block;font-family:Oswald,sans-serif;font-size:22px}
.statgrid span{font-size:11px;color:var(--sub)}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:12px;background:var(--line)}
.bar i{display:block}
.form{display:flex;gap:5px;flex-wrap:wrap}
.form .res{width:26px;height:26px;font-size:12px}
.rank{list-style:none}
.rank li{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.rank li:last-child{border-bottom:0}
.rank .n{width:26px;font-family:Oswald,sans-serif;color:var(--sub)}
.rank li:nth-child(1) .n{color:var(--gold);font-weight:700}
.rank .nm{flex:1}
.rank .v{font-family:Oswald,sans-serif;font-size:18px;font-weight:700}
.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));background:var(--gold);color:var(--green-d);
  border:0;border-radius:30px;padding:14px 22px;font-weight:900;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;
  display:flex;align-items:center;gap:6px}
.fab:active{transform:scale(.96)}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:50;align-items:flex-end;justify-content:center;padding-top:calc(env(safe-area-inset-top) + 10px);overscroll-behavior:contain}
.overlay.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:20px 20px 0 0;
  padding:0 16px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet-h{position:sticky;top:0;background:var(--bg);padding:16px 0 10px;border-radius:20px 20px 0 0;display:flex;align-items:center;justify-content:space-between;z-index:2}
.sheet-h h2{font-size:17px}
.x{background:none;border:0;font-size:26px;color:var(--sub);cursor:pointer;line-height:1;padding:4px 8px}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:5px}
.fg input,.fg select,.fg textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-size:16px}
.fg textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:9px 10px;white-space:nowrap;border-radius:8px;font-size:14px;cursor:pointer;color:var(--sub)}
.seg button.on{background:var(--green);color:#fff;font-weight:700}
.scorebox{background:var(--green);border-radius:14px;padding:14px;color:#fff;margin-bottom:12px}
.scorebox .teams{display:flex;justify-content:space-between;font-size:12px;opacity:.85;margin-bottom:6px}
.scorebox .nums{display:flex;align-items:center;justify-content:center;gap:12px}
.stepper{display:flex;flex-direction:column;align-items:center;gap:4px}
.stepper button{width:44px;height:30px;border:0;border-radius:8px;background:rgba(255,255,255,.15);color:#fff;font-size:18px;cursor:pointer}
.stepper input{width:64px;text-align:center;font-family:Oswald,sans-serif;font-size:40px;font-weight:700;background:none;border:0;color:#fff}
.scorebox .dash{font-family:Oswald;font-size:30px;color:var(--gold)}
.scorebox .total{display:flex;justify-content:center;align-items:center;gap:14px;margin:2px 0 10px}
.scorebox .total b{font-family:Oswald,sans-serif;font-size:44px;line-height:1}
.prow{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.08);border-radius:10px;padding:6px;margin-bottom:6px}
.prow[hidden]{display:none}
.prow .plb{font-size:12px;font-weight:700;color:var(--gold);width:40px;text-align:center}
.cell{display:flex;align-items:center;gap:4px}
.cell button{width:34px;height:34px;border:0;border-radius:8px;background:rgba(255,255,255,.16);color:#fff;font-size:18px;cursor:pointer}
.cell input{width:40px;text-align:center;font-family:Oswald,sans-serif;font-size:24px;font-weight:700;background:none;border:0;color:#fff}
.ettg{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer}
.lgnote{font-size:11px;color:var(--gold-l);text-align:center;margin:2px 0 4px}
.scorebox .sub{display:flex;justify-content:center;gap:16px;margin-top:10px;font-size:12px;align-items:center;flex-wrap:wrap}
.scorebox .sub input{width:42px;text-align:center;border-radius:6px;border:0;padding:4px;font-size:15px;background:rgba(255,255,255,.9);color:var(--ink)}
.scorers .sc{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.scorers .sc input{border:1px solid var(--line);border-radius:8px;padding:8px;font-size:15px;background:#fff;min-width:0}
.scorers .sc .nm{flex:2}.scorers .sc .mn{flex:0 0 56px;text-align:center}.scorers .sc .as{flex:1.5}
.scorers .del{border:0;background:none;color:var(--lose);font-size:20px;cursor:pointer;padding:0 4px}
.addbtn{border:1px dashed var(--green);background:none;color:var(--green);border-radius:10px;padding:8px;width:100%;font-weight:700;cursor:pointer;font-size:14px}
.btn{width:100%;border:0;border-radius:12px;padding:14px;font-weight:900;font-size:16px;cursor:pointer}
.btn.pri{background:var(--green);color:#fff}
.btn.danger{background:none;color:var(--lose);margin-top:8px;font-weight:700;font-size:14px}
.err{color:var(--lose);font-size:13px;margin-bottom:8px;min-height:1em}
/* detail */
.dhead{background:linear-gradient(160deg,var(--green),var(--green-d));color:#fff;border-radius:16px;padding:18px;text-align:center;margin-bottom:12px}
.dhead .when{font-size:12px;opacity:.8}
.dhead .vs{display:flex;align-items:center;justify-content:center;gap:14px;margin:10px 0 4px}
.dhead .tm{flex:1;font-weight:700;font-size:14px}
.dhead .big{font-family:Oswald,sans-serif;font-size:48px;font-weight:700;line-height:1}
.dhead .big em{color:var(--gold);font-style:normal;margin:0 6px}
.dhead .ht{font-size:12px;opacity:.85}
.dl{list-style:none;font-size:14px}
.dl li{padding:7px 0;border-bottom:1px solid var(--line);display:flex;gap:8px}
.dl li:last-child{border-bottom:0}
.dl .m{font-family:Oswald;color:var(--green);width:36px}
.memo{white-space:pre-wrap;font-size:14px;line-height:1.7}
.dact{display:flex;gap:8px}
.dact .btn{flex:1}
.btn.sec{background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:700}
.confirm{text-align:center;padding:20px 0}
.confirm p{margin-bottom:16px}
.sysvs{display:flex;align-items:center;text-align:center;gap:6px}
.sysvs>div{flex:1;background:var(--green-l);border-radius:10px;padding:10px 6px}
.sysvs>div:last-child{background:#f3f3f3}
.sysvs span{display:block;font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sysvs b{display:block;font-family:Oswald,"Noto Sans JP";font-size:20px;margin-top:2px}
.sysvs small{display:block;font-size:11px;color:var(--sub);margin-top:2px}
.sysvs em{font-style:normal;font-family:Oswald;color:var(--gold);font-weight:700}
.hl{width:100%;border-collapse:collapse;font-size:13px}
.hl th{font-size:11px;color:var(--sub);font-weight:500;text-align:left;padding-bottom:4px}
.hl td{padding:5px 4px 5px 0;vertical-align:middle}
.hl td:first-child{width:38px;font-weight:700}
.hb{display:flex;align-items:center;gap:6px}
.hb i{display:block;height:12px;border-radius:6px;min-width:2px}
.hb span{font-family:Oswald;font-weight:700}
.ins{font-size:13px;background:var(--gold-l);border-radius:8px;padding:6px 10px;margin-top:8px}
.st{width:100%;border-collapse:collapse;font-size:13px}
.st th{font-size:11px;color:var(--sub);font-weight:500;text-align:left;padding:4px 4px 6px;border-bottom:1px solid var(--line)}
.st td{padding:8px 4px;border-bottom:1px solid var(--line);font-family:Oswald,"Noto Sans JP",sans-serif;white-space:nowrap}
.st tr:last-child td{border-bottom:0}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.toast.on{opacity:1}
</style>
</head>

  if(old)cloud.db.collection("teams").doc(old).delete().catch(()=>{});
  cloud.viewCode=code;LS.set("fck-viewpushed-"+code,viewData());
}
function viewAttach(){
  cloud.db.collection("teams").doc(VIEW).onSnapshot(d=>{
    if(!d.exists||d.data().type!=="view"){if(!d.metadata.fromCache){matches=[];render();showViewMsg("このリンクは使えなくなりました。コーチに新しいリンクをもらってください")}return}
    try{matches=JSON.parse(d.data().json||"[]")}catch(e){matches=[]}
    LS.set("fck-viewdata",matches);$("#viewTeam").textContent=d.data().name||"";showViewMsg("");render();
  },e=>{console.log(e);showViewMsg("成績を読み込めませんでした")});
}
function showViewMsg(t){const n=$("#notice");n.textContent=t;n.className="notice warn";n.style.display=t?"block":"none"}
function updateNotice(){
  const n=$("#notice");let t="",cls="";
  if(cloud.err){t=cloud.err;cls="warn"}
  else if(!cloud.team){t="この端末だけに保存中。タップしてコーチと共有 →";cls="tap"}
  else if(cloud.ready){t="";}
  n.textContent=t;n.className="notice "+cls;n.style.display=t?"block":"none";
  $("#cloudBtn").classList.toggle("on",!!(cloud.team&&cloud.ready&&!cloud.err));
}
function putCloud(id,data){
  if(!(cloud.ready&&cloud.team))return;
  resCol().doc(id).set(data).catch(e=>{console.log(e);toast("クラウドに保存できませんでした")});
}
async function saveMatch(data,id){
  const nid=id||("r"+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
  if(id)matches=matches.map(m=>m.id===id?{...data,id}:m);else matches.push({...data,id:nid});
  saveLocal();render();putCloud(nid,data);
}
async function removeMatch(id){
  matches=matches.filter(m=>m.id!==id);saveLocal();render();
  if(cloud.ready&&cloud.team)resCol().doc(id).delete().catch(()=>toast("クラウドから削除できませんでした"));
}
async function uploadLocalOnly(){
  const q=await resCol().get();const have=new Set(q.docs.map(d=>d.id));
  await Promise.all(matches.filter(m=>!have.has(m.id)).map(m=>{const {id,...d}=m;return resCol().doc(id).set(d)}));
}
async function cloudCreate(name){
  const code=newCode();
  await cloud.db.collection("teams").doc(code).set({name:name||"FC.K",createdAt:Date.now(),updatedAt:Date.now()});
  cloud.team=code;LS.set("fck-team",code);await uploadLocalOnly();attach();
}
async function cloudJoin(raw){
  const code=normCode(raw);if(code.length!==12)throw new Error("len");
  const d=await cloud.db.collection("teams").doc(code).get();if(!d.exists)throw new Error("none");
  cloud.team=code;LS.set("fck-team",code);await uploadLocalOnly();attach();
}
function cloudLeave(){if(cloud.unsub)cloud.unsub();cloud.unsub=null;cloud.team=null;cloud.teamName="";LS.set("fck-team",null);updateNotice()}
function openCloud(){
  const body=!cloud.ready?`<p class="cp">${cloud.err?esc(cloud.err):"クラウドに接続中です…少し待ってからもう一度開いてください"}</p>`
  : cloud.team?`<div class="card"><h3>共有中のチーム</h3><p style="font-size:15px;font-weight:700">${esc(cloud.teamName||"チーム")}</p>
      <p class="cp">チームコード（ほかのコーチに伝えてください）</p><div class="code">${fmtCode(cloud.team)}</div>
      <button class="btn sec" id="cpCode">コードをコピー</button></div>
      <p class="cp">同じコードを入れた端末で、試合結果がリアルタイムに共有されます。試合分析ノートと同じコードが使えます。</p>
      <div class="card"><h3>選手用の閲覧リンク</h3>
        <p class="cp">選手はこのリンクから<b>試合一覧・試合詳細・成績</b>を見られます（登録・編集はできません）。</p>
        <label class="memotg"><input type="checkbox" id="memoTg" ${cloud.showMemo?"checked":""}>「メモ・振り返り」も選手に見せる</label>
        ${cloud.viewCode?`<div class="vlink">${esc(viewUrl(cloud.viewCode))}</div>
          <button class="btn pri" id="cpView">リンクをコピー</button>
          <button class="btn danger" id="reView">リンクを作り直す（古いリンクは見られなくなります）</button>`
        :`<button class="btn pri" id="mkView">選手用リンクを作る</button>`}
      </div>
      <button class="btn danger" id="leave">この端末の共有をやめる</button>`
  : `<div class="card"><h3>コードで参加する</h3><p class="cp">ほかのコーチから聞いた12文字のコード（試合分析ノートのコードも可）</p>
      <div class="fg"><input id="jc" placeholder="XXXX-XXXX-XXXX" autocapitalize="characters"></div><button class="btn pri" id="join">参加する</button></div>
     <div class="card"><h3>新しくチームを作る</h3><div class="fg"><input id="tn" value="FC.K" placeholder="チーム名"></div><button class="btn sec" id="mk">チームを作ってコードを発行</button></div>
     <p class="cp">この端末にある記録は、共有を始めるとチームに追加されます。</p>`;
  openSheet(`<div class="sheet-h"><h2>コーチと共有</h2><button class="x" data-close>×</button></div>${body}<div class="err" id="cerr"></div>`);
  $("[data-close]").onclick=closeSheet;
  const busy=(b,t)=>{b.disabled=true;b.textContent=t};
  if($("#cpCode"))$("#cpCode").onclick=async()=>{try{await navigator.clipboard.writeText(fmtCode(cloud.team));toast("コピーしました")}catch(e){toast(fmtCode(cloud.team))}};
  if($("#cpView"))$("#cpView").onclick=async()=>{const u=viewUrl(cloud.viewCode);try{await navigator.clipboard.writeText(u);toast("コピーしました。LINEなどで選手に送ってください")}catch(e){toast("コピーできませんでした")}};
  const mk=async e=>{busy(e.target,"作成中…");try{await makeViewLink();openCloud();toast("選手用リンクを作りました")}catch(err){console.log(err);e.target.disabled=false;e.target.textContent="もう一度試す";$("#cerr").textContent="作成できませんでした（電波を確認してください）"}};
  if($("#mkView"))$("#mkView").onclick=mk;
  if($("#memoTg"))$("#memoTg").onchange=async e=>{const v=e.target.checked;cloud.showMemo=v;
    try{await teamRef().set({showMemo:v,updatedAt:Date.now()},{merge:true});pushView(true);toast(v?"メモも選手に見せます":"メモは選手に見せません")}
    catch(err){e.target.checked=!v;cloud.showMemo=!v;toast("変更できませんでした")}};
  if($("#reView"))$("#reView").onclick=mk;
  if($("#leave"))$("#leave").onclick=()=>{cloudLeave();closeSheet();toast("共有をやめました（記録はこの端末に残ります）")};
  if($("#join"))$("#join").onclick=async e=>{busy(e.target,"確認中…");try{await cloudJoin($("#jc").value);closeSheet();toast("チームに参加しました")}catch(err){e.target.disabled=false;e.target.textContent="参加する";$("#cerr").textContent=err.message==="len"?"コードは12文字です":err.message==="none"?"そのコードのチームが見つかりません":"参加できませんでした（電波を確認してください）"}};

/* ---------- filters ---------- */
function filtered(){
  return matches.filter(m=>(state.year==="all"||(m.date||"").slice(0,4)===state.year)
    &&(state.cat==="all"||m.cat===state.cat)&&(state.kind==="all"||m.kind===state.kind))
    .sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.createdAt||0)-(a.createdAt||0));
}
function fillFilters(){
  const years=[...new Set(matches.map(m=>(m.date||"").slice(0,4)).filter(Boolean))].sort().reverse();
  const cats=[...new Set(matches.map(m=>m.cat).filter(Boolean))];
  const kinds=[...new Set(matches.map(m=>m.kind).filter(Boolean))];
  const set=(el,label,arr,key)=>{if(state[key]!=="all"&&!arr.includes(state[key]))state[key]="all";
    el.innerHTML=`<option value="all">${label}</option>`+arr.map(v=>`<option ${state[key]===v?"selected":""}>${esc(v)}</option>`).join("")};
  set($("#fYear"),"全シーズン",years,"year");set($("#fCat"),"全カテゴリー",cats,"cat");set($("#fKind"),"全種別",kinds,"kind");
}
["fYear","fCat","fKind"].forEach((id,i)=>$("#"+id).addEventListener("change",e=>{state[["year","cat","kind"][i]]=e.target.value;render()}));
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{
  state.tab=b.dataset.tab;document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
  $("#tab-list").hidden=state.tab!=="list";$("#tab-stats").hidden=state.tab!=="stats";render()}));

/* ---------- render ---------- */
function tally(list){
  const t={n:list.length,W:0,D:0,L:0,gf:0,ga:0};
  list.forEach(m=>{t[result(m)]++;t.gf+=+m.gf||0;t.ga+=+m.ga||0});return t;
}
function render(){
  fillFilters();
  const list=filtered();
  if(state.tab==="list")renderList(list);else renderStats(list);
}
function renderList(list){
  const el=$("#tab-list");
  if(!list.length){el.innerHTML=`<div class="empty"><img class="emb" src="${EMB}" alt=""><br>${matches.length?"条件に合う試合がありません":"まだ試合が登録されていません。<br>右下の「＋ 試合を登録」から追加しよう！"}</div>`;return}
  const t=tally(list);
  let html=`<div class="summary"><div><b>${t.n}</b><span>試合</span></div><div class="w"><b>${t.W}</b><span>勝</span></div><div class="d"><b>${t.D}</b><span>分</span></div><div class="l"><b>${t.L}</b><span>敗</span></div></div>`;
  let cur="";
  list.forEach(m=>{
    const mo=(m.date||"").slice(0,7);
    if(mo!==cur){cur=mo;const [y,mm]=mo.split("-");html+=`<div class="month">${y}年${+mm}月</div>`}
    const r=result(m);const d=m.date?`${+m.date.slice(5,7)}/${+m.date.slice(8,10)}(${wd(m.date)})`:"";
    const pk=(m.pkf!==""&&m.pkf!=null&&m.pka!==""&&m.pka!=null)?`<small>PK ${esc(m.pkf)}-${esc(m.pka)}</small>`:(m.h1f!==""&&m.h1f!=null?`<small>前${esc(m.h1f)}-${esc(m.h1a)} 後${esc(m.h2f)}-${esc(m.h2a)}</small>`:"");
    html+=`<div class="match" data-id="${esc(m.id)}"><div class="res ${r}">${RJ[r]}</div>
      <div class="minfo"><div class="opp">vs ${esc(m.opp)}</div><div class="meta">${d}${m.cat?`<span class="tag">${esc(m.cat)}</span>`:""}${m.kind?`<span class="tag k">${esc(m.kind)}</span>`:""}${m.sys||m.osys?`<span class="tag s">${esc(m.sys||"?")} vs ${esc(m.osys||"?")}</span>`:""}</div></div>
      <div class="score">${esc(m.gf)} - ${esc(m.ga)}${pk}</div></div>`;
  });
  el.innerHTML=html;
  el.querySelectorAll(".match").forEach(x=>x.addEventListener("click",()=>openDetail(x.dataset.id)));
}
function renderStats(list){
  const el=$("#tab-stats");
  if(!list.length){el.innerHTML=`<div class="empty"><img class="emb" src="${EMB}" alt=""><br>試合を登録すると成績が表示されます</div>`;return}
  const t=tally(list);const rate=t.n?Math.round(t.W/t.n*100):0;const diff=t.gf-t.ga;
  const goals={},assists={};
  list.forEach(m=>(m.scorers||[]).forEach(s=>{
    const n=(s.name||"").trim();if(n&&n!=="OG"&&n!=="オウンゴール")goals[n]=(goals[n]||0)+1;
    const a=(s.assist||"").trim();if(a)assists[a]=(assists[a]||0)+1;}));
  const rank=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const rk=(arr,u)=>arr.length?`<ul class="rank">${arr.map(([n,v],i)=>`<li><span class="n">${i+1}</span><span class="nm">${esc(n)}</span><span class="v">${v}</span>&nbsp;<small>${u}</small></li>`).join("")}</ul>`:`<p style="font-size:13px;color:var(--sub)">まだ記録がありません</p>`;
  const recent=[...list].slice(0,10).reverse();
  el.innerHTML=`
  <div class="card"><h3>通算成績</h3>
    <div class="statgrid">
      <div><b>${t.n}</b><span>試合</span></div>
      <div><b style="color:var(--win)">${t.W}</b><span>勝</span></div>
      <div><b style="color:var(--draw)">${t.D}</b><span>分</span></div>
      <div><b style="color:var(--lose)">${t.L}</b><span>敗</span></div>
      <div><b>${rate}<small style="font-size:13px">%</small></b><span>勝率</span></div>
      <div><b>${diff>0?"+":""}${diff}</b><span>得失点差</span></div>
      <div><b>${t.gf}</b><span>総得点</span></div>
      <div><b>${t.ga}</b><span>総失点</span></div>
      <div><b>${t.n?(t.gf/t.n).toFixed(1):0}</b><span>平均得点</span></div>
    </div>
    <div class="bar"><i style="width:${t.W/t.n*100}%;background:var(--win)"></i><i style="width:${t.D/t.n*100}%;background:var(--draw)"></i><i style="width:${t.L/t.n*100}%;background:var(--lose)"></i></div>
  </div>
  <div class="card"><h3>直近の流れ（古い→新しい）</h3><div class="form">${recent.map(m=>{const r=result(m);return`<div class="res ${r}" title="vs ${esc(m.opp)}">${RJ[r]}</div>`}).join("")}</div></div>
  ${halfCard(list)}
  ${sysTable(list)}
  ${sysTable(list,"osys","相手システム別成績","相手の開始時システムで集計")}
  <div class="card"><h3>得点ランキング</h3>${rk(rank(goals),"点")}</div>
  <div class="card"><h3>アシストランキング</h3>${rk(rank(assists),"A")}</div>`;
}

function halfCard(list){
  const hv=v=>v!==""&&v!=null;const L=list.filter(m=>hv(m.h1f));
  if(!L.length)return"";
  const s={h1f:0,h1a:0,h2f:0,h2a:0};L.forEach(m=>{for(const k in s)s[k]+=+m[k]||0});
  const mx=Math.max(1,...Object.values(s));
  const bar=(v,c)=>`<div class="hb"><i style="width:${v/mx*100}%;background:${c}"></i><span>${v}</span></div>`;
  const ins=[];
  if(s.h2a>s.h1a*1.5&&s.h2a>=3)ins.push("後半の失点が多め。運動量・交代策を要チェック");
  if(s.h1a>s.h2a*1.5&&s.h1a>=3)ins.push("前半の失点が多め。立ち上がりの入り方を要チェック");
  if(s.h2f>s.h1f*1.5&&s.h2f>=3)ins.push("後半に得点が集中。ハーフタイムの修正が効いている");
  if(s.h1f>s.h2f*1.5&&s.h1f>=3)ins.push("前半に得点が集中。後半の追加点が課題");
  return`<div class="card"><h3>前半・後半の得失点</h3>
   <table class="hl"><tr><th></th><th>得点</th><th>失点</th></tr>
   <tr><td>前半</td><td>${bar(s.h1f,"var(--win)")}</td><td>${bar(s.h1a,"var(--lose)")}</td></tr>
   <tr><td>後半</td><td>${bar(s.h2f,"var(--win)")}</td><td>${bar(s.h2a,"var(--lose)")}</td></tr></table>
   ${ins.map(t=>`<p class="ins">💡 ${t}</p>`).join("")}
   <p style="font-size:11px;color:var(--sub);margin-top:6px">前後半を入力した${L.length}試合で集計（延長は除く）</p></div>`;
}
function sysTable(list,key="sys",title="システム別成績（FC.K）",note="開始時のシステムで集計"){
  const g={};list.forEach(m=>{if(!m[key])return;(g[m[key]]=g[m[key]]||[]).push(m)});
  const rows=Object.entries(g).map(([k,v])=>[k,tally(v)]).sort((a,b)=>b[1].n-a[1].n);
  if(!rows.length)return`<div class="card"><h3>${title}</h3><p style="font-size:13px;color:var(--sub)">試合登録でシステムを入れると表示されます</p></div>`;
  return`<div class="card"><h3>${title}</h3><table class="st"><thead><tr><th>システム</th><th>試合</th><th>勝-分-敗</th><th>勝率</th><th>得/失</th></tr></thead><tbody>${
    rows.map(([k,t])=>`<tr><td><b>${esc(k)}</b></td><td>${t.n}</td><td><span style="color:var(--win)">${t.W}</span>-<span style="color:var(--draw)">${t.D}</span>-<span style="color:var(--lose)">${t.L}</span></td><td>${Math.round(t.W/t.n*100)}%</td><td>${(t.gf/t.n).toFixed(1)} / ${(t.ga/t.n).toFixed(1)}</td></tr>`).join("")
  }</tbody></table><p style="font-size:11px;color:var(--sub);margin-top:6px">得/失は1試合平均。${note}</p></div>`;
}
/* ---------- sheet ---------- */
function openSheet(html){document.body.style.overflow="hidden";$("#sheet").innerHTML=html;$("#ov").classList.add("on");$("#sheet").scrollTop=0}
function closeSheet(){document.body.style.overflow="";$("#ov").classList.remove("on")}
$("#ov").addEventListener("click",e=>{if(e.target.id==="ov")closeSheet()});

function openDetail(id){
  const m=matches.find(x=>x.id===id);if(!m)return;
  const r=result(m);
  const pk=(m.pkf!==""&&m.pkf!=null&&m.pka!==""&&m.pka!=null)?` ／ PK ${esc(m.pkf)}-${esc(m.pka)}`:"";
  const hv=v=>v!==""&&v!=null;
  const ht=hv(m.h1f)?`前半 ${esc(m.h1f)}-${esc(m.h1a)} ／ 後半 ${esc(m.h2f)}-${esc(m.h2a)}${hv(m.etf)?` ／ 延長 ${esc(m.etf)}-${esc(m.eta)}`:""}`:(hv(m.hgf)?`前半 ${esc(m.hgf)}-${esc(m.hga)}`:"");
  const sc=(m.scorers||[]).filter(s=>s.name);
  openSheet(`<div class="sheet-h"><h2>試合詳細</h2><button class="x" data-close>×</button></div>
    <div class="dhead"><div class="when">${esc(m.date)}${m.date?`（${wd(m.date)}）`:""} ${m.cat?"・"+esc(m.cat):""} ${m.kind?"・"+esc(m.kind):""}</div>
      <div class="vs"><div class="tm">FC.K</div><div class="big">${esc(m.gf)}<em>-</em>${esc(m.ga)}</div><div class="tm">${esc(m.opp)}</div></div>
      <div class="ht">${ht}${pk}　<span class="res ${r}" style="display:inline-grid;width:24px;height:24px;font-size:12px;vertical-align:middle">${RJ[r]}</span></div></div>
    ${m.sys||m.osys?`<div class="card"><h3>システム</h3><div class="sysvs">
      <div><span>FC.K</span><b>${esc(m.sys||"—")}</b>${m.sys2?`<small>→ ${esc(m.sys2)}</small>`:""}</div>
      <em>vs</em>
      <div><span>${esc(m.opp)}</span><b>${esc(m.osys||"—")}</b>${m.osys2?`<small>→ ${esc(m.osys2)}</small>`:""}</div></div></div>`:""}
    ${m.venue||m.ha?`<div class="card"><h3>会場</h3><p style="font-size:14px">${esc(m.venue||"—")} ${m.ha?`<span class="tag">${esc(m.ha)}</span>`:""}</p></div>`:""}
    <div class="card"><h3>得点者</h3>${sc.length?`<ul class="dl">${sc.map(s=>`<li><span class="m">${s.min?esc(s.min)+"'":"—"}</span><span>⚽ ${esc(s.name)}${s.assist?`<small style="color:var(--sub)">（A: ${esc(s.assist)}）</small>`:""}</span></li>`).join("")}</ul>`:`<p style="font-size:13px;color:var(--sub)">記録なし</p>`}</div>
    ${m.memo?`<div class="card"><h3>メモ・振り返り</h3><div class="memo">${esc(m.memo)}</div></div>`:""}
    ${canWrite?`<div class="dact"><button class="btn sec" id="dCopy">結果をコピー</button><button class="btn pri" id="dEdit">編集</button></div>
    <button class="btn danger" id="dDel">この試合を削除</button>`:`<button class="btn sec" id="dCopy">結果をコピー</button>`}`);
  $("[data-close]").onclick=closeSheet;
  $("#dCopy").onclick=async()=>{
    const txt=`【試合結果】${m.date}${m.cat?" "+m.cat:""}${m.kind?" "+m.kind:""}\nFC.K ${m.gf}-${m.ga} ${m.opp}${ht?"（"+ht+"）":""}${pk?" "+pk.replace(" ／ ",""):""}\n${sc.length?"得点："+sc.map(s=>`${s.name}${s.min?"("+s.min+"')":""}`).join("、"):""}`.trim();
    try{await navigator.clipboard.writeText(txt);toast("コピーしました")}catch(e){toast("コピーできませんでした")}};
  if(canWrite){
    $("#dEdit").onclick=()=>openForm(m);
    $("#dDel").onclick=()=>openSheet(`<div class="confirm"><p><b>vs ${esc(m.opp)}</b>（${esc(m.date)}）<br>を削除しますか？</p>
      <button class="btn pri" style="background:var(--lose)" id="cY">削除する</button><button class="btn sec" style="margin-top:8px" id="cN">やめる</button></div>`)
      ||($("#cN").onclick=()=>openDetail(id),$("#cY").onclick=async()=>{try{await removeMatch(id);closeSheet();toast("削除しました")}catch(e){toast("削除できませんでした")}});
  }
}

function openForm(m){
  const isEdit=!!m;
  const today=new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
  m=m||{date:today,cat:state.cat!=="all"?state.cat:(matches[0]?.cat||""),kind:"練習試合",opp:"",venue:"",sys:matches.find(x=>x.sys&&(state.cat==="all"||x.cat===state.cat))?.sys||"",sys2:"",osys:"",osys2:"",ha:"",gf:0,ga:0,hgf:"",hga:"",pkf:"",pka:"",scorers:[],memo:""};
  const cats=[...new Set([...matches.map(x=>x.cat).filter(Boolean),...DEFAULT_CATS])];
  const opps=[...new Set(matches.map(x=>x.opp).filter(Boolean))];
  const venues=[...new Set(matches.map(x=>x.venue).filter(Boolean))];
  const syss=[...new Set([...matches.flatMap(x=>[x.sys,x.sys2,x.osys,x.osys2]).filter(Boolean),...SYSTEMS])];
  const players=[...new Set(matches.flatMap(x=>(x.scorers||[]).flatMap(s=>[s.name,s.assist])).filter(Boolean))];
  const has=v=>v!==""&&v!=null;
  let pv={h1f:m.h1f,h1a:m.h1a,h2f:m.h2f,h2a:m.h2a,etf:m.etf,eta:m.eta},legacy=false;
  if(!has(m.h1f)&&!has(m.h2f)&&!has(m.h1a)&&!has(m.h2a)){
    if(isEdit){ if(has(m.hgf)){pv={h1f:m.hgf,h1a:m.hga,h2f:Math.max(0,m.gf-m.hgf),h2a:Math.max(0,m.ga-m.hga)}}
      else{pv={h1f:m.gf,h1a:m.ga,h2f:0,h2a:0};legacy=true} }
    else pv={h1f:0,h1a:0,h2f:0,h2a:0,etf:"",eta:""};
  }
  let hasEt=has(pv.etf)||has(pv.eta);
  openSheet(`<div class="sheet-h"><h2>${isEdit?"試合を編集":"試合を登録"}</h2><button class="x" data-close>×</button></div>
    <form id="mf" autocomplete="off">
      <div class="row"><div class="fg"><label>日付</label><input type="date" name="date" value="${esc(m.date)}" required></div>
        <div class="fg"><label>カテゴリー</label><input name="cat" list="dlCat" value="${esc(m.cat)}" placeholder="U14"></div></div>
      <div class="fg"><label>試合種別</label><select name="kind">${KINDS.map(k=>`<option ${m.kind===k?"selected":""}>${k}</option>`).join("")}</select></div>
      <div class="fg"><label>対戦相手</label><input name="opp" list="dlOpp" value="${esc(m.opp)}" placeholder="例：〇〇FC" required></div>
      <div class="row"><div class="fg"><label>FC.Kのシステム</label><input name="sys" list="dlSys" value="${esc(m.sys)}" placeholder="例：4-4-2"></div>
        <div class="fg"><label>FC.K 途中変更（任意）</label><input name="sys2" list="dlSys" value="${esc(m.sys2)}" placeholder="例：3-4-3"></div></div>
      <div class="row"><div class="fg"><label>相手のシステム</label><input name="osys" list="dlSys" value="${esc(m.osys)}" placeholder="例：3-5-2"></div>
        <div class="fg"><label>相手 途中変更（任意）</label><input name="osys2" list="dlSys" value="${esc(m.osys2)}" placeholder="例：5-4-1"></div></div>
      <div class="scorebox">
        <div class="teams"><span>FC.K</span><span id="oppLbl">${esc(m.opp)||"相手"}</span></div>
        <div class="total"><b id="tF">0</b><span class="dash">-</span><b id="tA">0</b></div>
        ${PERIODS.map(([k,lb])=>`<div class="prow" data-p="${k}" ${k==="et"&&!hasEt?"hidden":""}>
          <div class="cell"><button type="button" data-inc="${k}f" data-d="-1">−</button><input name="${k}f" type="number" inputmode="numeric" min="0" value="${esc(pv[k+"f"])}"><button type="button" data-inc="${k}f" data-d="1">＋</button></div>
          <span class="plb">${lb}</span>
          <div class="cell"><button type="button" data-inc="${k}a" data-d="-1">−</button><input name="${k}a" type="number" inputmode="numeric" min="0" value="${esc(pv[k+"a"])}"><button type="button" data-inc="${k}a" data-d="1">＋</button></div>
        </div>`).join("")}
        ${legacy?`<p class="lgnote">※前半・後半の内訳を確認してください</p>`:""}
        <div class="sub"><button type="button" class="ettg" id="etTg">${hasEt?"− 延長を消す":"＋ 延長"}</button>
          <span>PK <input name="pkf" type="number" inputmode="numeric" min="0" value="${esc(m.pkf)}"> - <input name="pka" type="number" inputmode="numeric" min="0" value="${esc(m.pka)}"></span></div>
      </div>
      <div class="fg"><label>得点者（名前・分・アシスト）</label><div class="scorers" id="scList"></div>
        <button type="button" class="addbtn" id="addSc">＋ 得点者を追加</button></div>
      <div class="row"><div class="fg"><label>会場</label><input name="venue" list="dlVen" value="${esc(m.venue)}" placeholder="例：〇〇グラウンド"></div>
        <div class="fg" style="flex:0 0 auto"><label>H / A</label><div class="seg" id="haSeg">${["H","A","中立"].map(v=>`<button type="button" class="${m.ha===v?"on":""}" data-v="${v}">${v}</button>`).join("")}</div></div></div>
      <div class="fg"><label>メモ・振り返り</label><textarea name="memo" placeholder="良かった点、課題など">${esc(m.memo)}</textarea></div>
      <div class="err" id="ferr"></div>
      <button class="btn pri" type="submit" id="fsave">${isEdit?"更新する":"登録する"}</button>
    </form>
    <datalist id="dlCat">${cats.map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
    <datalist id="dlOpp">${opps.map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
    <datalist id="dlVen">${venues.map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
    <datalist id="dlSys">${syss.map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
    <datalist id="dlPl">${players.map(c=>`<option value="${esc(c)}">`).join("")}</datalist>`);
  $("[data-close]").onclick=()=>isEdit?openDetail(m.id):closeSheet();
  const f=$("#mf");let ha=m.ha||"";
  f.opp.addEventListener("input",()=>$("#oppLbl").textContent=f.opp.value||"相手");
  const sumUp=()=>{let F=0,A=0;PERIODS.forEach(([k])=>{if(k==="et"&&!hasEt)return;F+=+f[k+"f"].value||0;A+=+f[k+"a"].value||0});$("#tF").textContent=F;$("#tA").textContent=A;return[F,A]};
  f.querySelectorAll("[data-inc]").forEach(b=>b.onclick=()=>{const i=f[b.dataset.inc];const before=+i.value||0;const d=+b.dataset.d;i.value=Math.max(0,before+d);
    const ours=b.dataset.inc.endsWith("f");
    if(ours&&d>0){addScorer({min:b.dataset.inc.startsWith("h2")?"":""})}
    if(ours&&d<0&&before>0){const rows=$("#scList").children;const last=rows[rows.length-1];if(last&&!last.querySelector(".nm").value)last.remove()}
    sumUp()});
  f.querySelectorAll(".prow input").forEach(i=>i.addEventListener("input",sumUp));
  $("#etTg").onclick=()=>{hasEt=!hasEt;const row=f.querySelector('[data-p="et"]');row.hidden=!hasEt;
    if(hasEt){if(f.etf.value==="")f.etf.value=0;if(f.eta.value==="")f.eta.value=0}else{f.etf.value="";f.eta.value=""}
    $("#etTg").textContent=hasEt?"− 延長を消す":"＋ 延長";sumUp()};
  sumUp();
  $("#haSeg").querySelectorAll("button").forEach(b=>b.onclick=()=>{ha=ha===b.dataset.v?"":b.dataset.v;$("#haSeg").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x.dataset.v===ha))});
  function addScorer(s){const d=document.createElement("div");d.className="sc";
    d.innerHTML=`<input class="nm" list="dlPl" placeholder="得点者" value="${esc(s.name)}"><input class="mn" inputmode="numeric" placeholder="分" value="${esc(s.min)}"><input class="as" list="dlPl" placeholder="アシスト" value="${esc(s.assist)}"><button type="button" class="del">×</button>`;
    d.querySelector(".del").onclick=()=>d.remove();$("#scList").appendChild(d)}
  (m.scorers||[]).forEach(addScorer);
  $("#addSc").onclick=()=>addScorer({});
  f.addEventListener("submit",async e=>{
    e.preventDefault();
    const num=v=>v===""?"":Math.max(0,parseInt(v,10)||0);
    const data={date:f.date.value,cat:f.cat.value.trim(),kind:f.kind.value,opp:f.opp.value.trim(),venue:f.venue.value.trim(),ha,sys:f.sys.value.trim(),sys2:f.sys2.value.trim(),osys:f.osys.value.trim(),osys2:f.osys2.value.trim(),
      ...(()=>{const [F,A]=sumUp();const o={gf:F,ga:A,h1f:num(f.h1f.value)||0,h1a:num(f.h1a.value)||0,h2f:num(f.h2f.value)||0,h2a:num(f.h2a.value)||0,etf:hasEt?num(f.etf.value)||0:"",eta:hasEt?num(f.eta.value)||0:""};o.hgf=o.h1f;o.hga=o.h1a;return o})(),pkf:num(f.pkf.value),pka:num(f.pka.value),
      scorers:[...$("#scList").children].map(r=>({name:r.querySelector(".nm").value.trim(),min:r.querySelector(".mn").value.trim(),assist:r.querySelector(".as").value.trim()})).filter(s=>s.name),
      memo:f.memo.value.trim(),createdAt:m.createdAt||Date.now(),updatedAt:Date.now()};
    if(!data.date||!data.opp){$("#ferr").textContent="日付と対戦相手は必須です";return}
    $("#fsave").disabled=true;$("#fsave").textContent="保存中…";
    try{await saveMatch(data,isEdit?m.id:null);
      if(data.cat&&state.cat!=="all"&&state.cat!==data.cat)state.cat="all";
      closeSheet();toast(isEdit?"更新しました":"登録しました！");
    }catch(err){$("#fsave").disabled=false;$("#fsave").textContent=isEdit?"更新する":"登録する";
      $("#ferr").textContent=err.code==="invalid_argument"?"保存する権限がありません":err.code==="quota_exceeded"?"保存容量の上限です":"保存に失敗しました。もう一度お試しください"}
  });
}
$("#fab").onclick=()=>openForm(null);
$("#cloudBtn").onclick=openCloud;

$("#exitView").onclick=()=>{LS.set("fck-view",null);location.href=location.pathname};
$("#notice").onclick=()=>{if(!cloud.team)openCloud()};
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
init();
</script>
</body>
</html>
